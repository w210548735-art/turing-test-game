name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Public repository privacy scan
        run: node tools/check-public-repo.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Existing unit tests
        run: npm test

      - name: Safety module unit tests
        run: >-
          npx tsx --test
          apps/server/src/moderation/pipeline.test.ts
          apps/server/src/reports/service.test.ts
          apps/server/src/risk/service.test.ts
          apps/server/src/admin/auth.test.ts

      - name: Production build
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f infra/server.Dockerfile -t turing-server:ci .

      - name: Build web image
        run: docker build -f infra/web.Dockerfile -t turing-web:ci .
