name: turing-gate-alpha

services:
  server:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      WEB_ORIGIN: ${WEB_ORIGIN:-${SITE_ADDRESS:-http://localhost}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${SITE_ADDRESS:-http://localhost}}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-${SITE_ADDRESS:-http://localhost}}
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      QQ_SMTP_USER: ${QQ_SMTP_USER:?set QQ_SMTP_USER}
      QQ_SMTP_FROM_NAME: ${QQ_SMTP_FROM_NAME:-图灵测试}
      QQ_SMTP_AUTH_CODE_FILE: /run/secrets/qq_smtp_auth_code
      FEEDBACK_RECIPIENT_EMAIL: ${FEEDBACK_RECIPIENT_EMAIL:-admin@example.com}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      ALLOW_ONLINE_GUESTS: ${ALLOW_ONLINE_GUESTS:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-turing}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-turing}
      REDIS_URL: redis://redis:6379/0
      BAN_IDENTIFIER_PEPPER: ${BAN_IDENTIFIER_PEPPER:?set BAN_IDENTIFIER_PEPPER}
      CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET}
      ADMIN_PRINCIPALS_JSON: ${ADMIN_PRINCIPALS_JSON:-[]}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-20}
      AI_HOURLY_REQUEST_LIMIT: ${AI_HOURLY_REQUEST_LIMIT:-1000}
      AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-1000000}
      MATCH_MAX_CONCURRENT_ROOMS: ${MATCH_MAX_CONCURRENT_ROOMS:-50}
      MATCH_MAX_QUEUE_SIZE: ${MATCH_MAX_QUEUE_SIZE:-500}
    secrets:
      - deepseek_api_key
      - qq_smtp_auth_code
    group_add:
      - "${SECRET_GID:?set SECRET_GID}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - private

  migrate:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-turing}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-turing}
    command: ["node", "apps/server/dist/src/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - private

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-turing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - private

secrets:
  deepseek_api_key:
    file: ${DEEPSEEK_API_KEY_SECRET_FILE:-./secrets/deepseek_api_key.txt}
  qq_smtp_auth_code:
    file: ${QQ_SMTP_AUTH_CODE_SECRET_FILE:-./secrets/qq_smtp_auth_code.txt}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
